name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r apps/api/requirements-api.txt
      - run: python -m ruff check src tools tests apps/api
      # The production deployment gate is intentionally root-only on Linux.
      # GitHub-hosted Ubuntu runners provide passwordless sudo for this test.
      - run: sudo --preserve-env=PATH python -m pytest
      - run: python -m pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8531
