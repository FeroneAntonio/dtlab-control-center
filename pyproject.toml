[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dtlab-control-center"
version = "2.0.0.dev0"
description = "DTLab OT Security Control Center"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
# The isolated PLC integration intentionally supports Python 2.7/Pymodbus 2.5.3.
# It has its own compatibility test suite and cannot be rewritten to py312 idioms.
extend-exclude = ["legacy", "integrations/plc_endpoint_audit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
